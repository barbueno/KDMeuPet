<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Animal - KDMeuPet</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="cadastro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  
  <main class="container form-page">
    <div class="form-header">
      <h1>Cadastro de Animais</h1>
      <p>Perdidos ou Encontrados</p>
    </div>

    <form class="animal-form">
      <div class="form-grid">
        <section class="form-column" aria-labelledby="details-title">
          <h2 id="details-title" class="sr-only">Detalhes do Animal</h2>

          <fieldset class="form-group">
            <legend>Situação do Animal</legend>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="situacao" value="perdido" checked>
                <span class="radio-custom"></span>
                Perdido
              </label>
              <label class="radio-label">
                <input type="radio" name="situacao" value="encontrado">
                <span class="radio-custom"></span>
                Encontrado
              </label>
            </div>
          </fieldset>

          <div class="form-group">
            <label for="tipo">Tipo de Animal</label>
            <select id="tipo" required>
              <option value="" disabled selected>Selecione o tipo</option>
              <option value="cachorro">Cachorro</option>
              <option value="gato">Gato</option>
              <option value="passaro">Pássaro</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="nome">Nome do Animal (se souber)</label>
            <input type="text" id="nome" placeholder="Nome do animal">
          </div>

          <div class="form-group">
            <label for="raca">Raça (se souber)</label>
            <input type="text" id="raca" placeholder="Raça do animal">
          </div>

          <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="5" placeholder="Descreva características do animal, como cor, tamanho, coleira, etc."></textarea>
          </div>
        </section>

        <section class="form-column" aria-labelledby="media-title">
          <h2 id="media-title" class="sr-only">Mídia e Localização</h2>

          <div class="form-group">
            <label for="foto">Foto do Animal</label>
            <div class="upload-area">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <p>Clique para adicionar uma foto</p>
              <input type="file" id="foto" class="sr-only" accept="image/*">
            </div>
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('foto').click()">
              Selecionar Foto
            </button>
          </div>

          <div class="form-group">
            <label>Localização</label>
            <div class="map-placeholder">
              <i class="fa-solid fa-map-marker-alt map-pin"></i>
            </div>
            <div class="location-inputs">
              <input type="text" id="latitude" placeholder="Latitude" readonly>
              <input type="text" id="longitude" placeholder="Longitude" readonly>
            </div>
            <button type="button" class="btn btn-primary" id="btn-location">
              <i class="fa-solid fa-location-crosshairs"></i>
              Usar Minha Localização Atual
            </button>
          </div>
        </section>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Cadastrar Animal</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('btn-location').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          document.getElementById('latitude').value = position.coords.latitude.toFixed(6);
          document.getElementById('longitude').value = position.coords.longitude.toFixed(6);
          // Aqui você moveria o pino do mapa
          alert('Localização capturada!');
        }, () => {
          alert('Não foi possível obter a localização. Verifique as permissões do navegador.');
        });
      } else {
        alert('Geolocalização não é suportada por este navegador.');
      }
    });
  </script>
</body>
</html>
